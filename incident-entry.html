<!DOCTYPE html>
<html>
<head>
    <title>Incident File</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="login.html" class="adminLink">LOGIN / SIGN UP</a>
<a href="records.html" class="recordsLink">RECORDS DIVISION</a>

<header>
    <h1 id="number">LOADING...</h1>
    <h2 id="title"></h2>
    <input type="text" id="titleEdit" style="display:none;" placeholder="Incident title">

    <div id="imageView"></div>
    <input type="file" id="imageEdit" accept="image/*" style="display:none;">

    <p id="tagView">SEVERITY: ...</p>
    <div id="metaHeader"></div>
</header>

<div id="recordBody"></div>

<button id="editBtn" style="display:none;">EDIT FILE</button>
<button id="revealBtn" style="display:none;">REVEAL REDACTIONS</button>
<button id="deleteBtn" style="display:none;">DELETE FILE</button>

<a href="incidents.html" class="backBtn">⬅ BACK TO DATABASE</a>

<p id="status"></p>

<script type="module">
import { initRecordView } from "./record-view.js";

initRecordView({
    collection: "incidents",
    label: "INCIDENT",
    listHref: "incidents.html",
    tag: {
        key: "severity",
        label: "SEVERITY",
        options: ["MINOR", "MODERATE", "SEVERE", "CATASTROPHIC", "TOTAL BREACH"]
    },
    meta: [
        { key: "status", label: "STATUS", options: ["ONGOING", "CONTAINED", "RESOLVED", "UNRESOLVED", "COVERED UP"] }
    ],
    fields: [
        { key: "date", label: "DATE OF OCCURRENCE" },
        { key: "summary", label: "SUMMARY" },
        { key: "description", label: "INCIDENT REPORT" },
        { key: "resolution", label: "RESOLUTION" },
        { key: "addendum", label: "ADDENDUM" }
    ],
    refs: [
        { key: "entitiesInvolved", label: "ENTITIES INVOLVED", collection: "entities", href: "entry.html" },
        { key: "personnelInvolved", label: "PERSONNEL INVOLVED", collection: "personnel", href: "personnel-entry.html" }
    ]
});
</script>

<script type="module" src="nav-auth.js"></script>
<script src="cornfall.js"></script>
<script src="transitions.js"></script>
</body>
</html>
