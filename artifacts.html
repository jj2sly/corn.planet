<!DOCTYPE html>
<html>
<head>
    <title>Corn Planet Artifact Database</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    
    <h1>CORN PLANET ARTIFACT DATABASE</h1>
    <p>SECURE • STUDY • DOCUMENT</p>
</header>
<div class="warning">
    ACCESS LEVEL 2 REQUIRED
</div>
<a href="classification.html" class="backBtn">VIEW CLASSIFICATION SYSTEM</a>
<a href="index.html" class="backBtn">⬅ BACK TO HOME</a>
    <div class="database">
  <h2>Artifact Index</h2>

  <div class="filterBar">
  <label for="sortSelect">Sort by</label>
  <select id="sortSelect">
      <option value="id">ID Number</option>
      <option value="titleAsc">Title (A–Z)</option>
      <option value="titleDesc">Title (Z–A)</option>
      <option value="classification">Classification</option>
  </select>
  </div>

  <div id="container" class="recordGrid"><p class="loadingText">DECRYPTING DATABASE...</p></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { recordCard } from "./cpi-ui.js";
  const firebaseConfig = {
  apiKey: "AIzaSyBshT0wE2kjCIPpt1BozZvLlY3kGwWEH90",
  authDomain: "cpo-9af17.firebaseapp.com",
  projectId: "cpo-9af17",
  storageBucket: "cpo-9af17.firebasestorage.app",
  messagingSenderId: "526427336111",
  appId: "1:526427336111:web:8b71369117416ae937d35a"
};
    const container = document.getElementById("container");
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadClassificationColors() {
      const colorMap = {};
      try {
          const querySnapshot = await getDocs(collection(db, "classifications"));
          querySnapshot.forEach((docSnap) => {
              const data = docSnap.data();
              const name = (data.name || docSnap.id).toUpperCase();
              colorMap[name] = data.color || "#ffd400";
          });
      } catch (err) {
          console.warn("Could not load classification colors:", err);
      }
      return colorMap;
  }

  async function loadEntries() {
  const colorMap = await loadClassificationColors();
  const querySnapshot = await getDocs(collection(db, "artifacts"));
  console.log("ARTIFACTS FOUND:", querySnapshot.size);

  if (!querySnapshot.size) {
    container.innerHTML = "<p>No artifacts found in database.</p>";
    return;
  }

  let items = [];
  querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      items.push({
          id: docSnap.id,
          title: data.title || "UNTITLED ARTIFACT",
          classification: (data.classification || "UNKNOWN").toString(),
          containment: (data.containment || "").toString()
      });
  });

  function render(sortMode) {
      let sorted = items.slice();

      if (sortMode === "titleAsc") {
          sorted.sort((a, b) => a.title.localeCompare(b.title));
      } else if (sortMode === "titleDesc") {
          sorted.sort((a, b) => b.title.localeCompare(a.title));
      } else if (sortMode === "classification") {
          sorted.sort((a, b) => a.classification.localeCompare(b.classification));
      } else {
          sorted.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
      }

      container.innerHTML = "";
      sorted.forEach((item) => {
          const upperClass = item.classification.toUpperCase();
          container.appendChild(recordCard({
              href: `artifact-entry.html?id=${encodeURIComponent(item.id)}`,
              id: item.id,
              type: "ARTIFACT",
              title: item.title,
              tags: [
                  { key: "Classification", value: item.classification, color: colorMap[upperClass] },
                  { key: "Containment", value: item.containment }
              ]
          }));
      });
  }

  render("id");

  document.getElementById("sortSelect").addEventListener("change", (e) => {
      render(e.target.value);
  });
}
  loadEntries();
</script>
<script type="module" src="cpi-shell.js"></script>
<script src="cornfall.js"></script>
<script src="transitions.js"></script>
</body>
</html>
