name: Corn Planet Party Checks

on:
  workflow_dispatch:
  push:
    branches: [cpst-party]
    paths:
      - "party/server/**"
      - "party/public/**"
      - "party/test/**"
      - "party/godot/**"
      - "party/desktop/**"
      - "party/package.json"
      - "party/package-lock.json"
      - ".github/workflows/party-check.yml"
  pull_request:
    paths:
      - "party/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: party/package-lock.json
      - run: npm ci
      - run: npm run check
