name: CPI iPhone Checks

on:
  workflow_dispatch:
  push:
    branches:
      - cpst-party
    paths:
      - "party/ios/**"
      - ".github/workflows/cpi-ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build CPI Party for iPhone Simulator
        working-directory: party/ios
        run: |
          set -o pipefail
          xcodebuild             -project CPIPhone.xcodeproj             -scheme CPIPhone             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
